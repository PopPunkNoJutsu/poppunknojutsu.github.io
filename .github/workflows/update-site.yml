name: Update channel and publish website

on:
  schedule:
    # Request a check every 15 minutes; GitHub may delay or skip scheduled runs.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: channel-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Test the updater
        run: python3 -m unittest -v test_sync_youtube.py test_sync_playlists.py
      - name: Check YouTube for new uploads
        id: youtube
        continue-on-error: true
        run: python3 sync_youtube.py
      - name: Prepare the public channel checker
        id: channel_tools
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python3 -m venv .playlist-runtime
          .playlist-runtime/bin/python -m pip install --disable-pip-version-check yt-dlp==2026.8.19
      - name: Check the Videos tab for uploads missing from the feed
        id: upload_fallback
        if: steps.channel_tools.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: .playlist-runtime/bin/python sync_youtube.py --channel-page
      - name: Keep the saved catalog if both upload sources are unavailable
        if: steps.youtube.outcome == 'failure' && steps.upload_fallback.outcome != 'success'
        run: |
          echo "::warning::YouTube uploads could not be checked. The saved catalog is preserved; the next scheduled run will retry."
          python3 sync_youtube.py --render-only
      - name: Check YouTube for new playlists
        id: playlists
        continue-on-error: true
        timeout-minutes: 3
        run: .playlist-runtime/bin/python sync_playlists.py
      - name: Keep saved playlists if YouTube is temporarily unavailable
        if: steps.playlists.outcome == 'failure'
        run: |
          echo "::warning::YouTube playlists could not be checked. Saved playlists are preserved; the next scheduled run will retry."
          python3 sync_playlists.py --render-only
      - name: Save catalog changes
        run: |
          git add catalog.json covers.js playlists.json index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync YouTube uploads and playlists"
            git push
          fi
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html styles.css script.js covers.js .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Record sync result
        run: |
          echo "YouTube feed check: ${{ steps.youtube.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "YouTube channel Videos check: ${{ steps.upload_fallback.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "YouTube upload check: ${{ (steps.youtube.outcome == 'success' || steps.upload_fallback.outcome == 'success') && 'success' || 'failure' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "YouTube playlist check: ${{ steps.playlists.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json; print('Catalog: ' + str(len(json.load(open('catalog.json'))['videos'])) + ' uploads')" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json; print('Playlists: ' + str(len(json.load(open('playlists.json'))['playlists'])))" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
